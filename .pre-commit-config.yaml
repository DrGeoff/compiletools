repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.409
    hooks:
      - id: pyright
        # Pyright must see the project's deps (stringzilla, configargparse,
        # rich, …) — the hook's isolated env doesn't have them. Pointing
        # pyright at the worktree's mandatory ``.venv/`` (see CLAUDE.md
        # "Worktree-Based Development") is cleaner than enumerating runtime
        # deps via additional_dependencies, and stays in sync with whatever
        # ``uv pip install -e .[dev]`` resolves.
        pass_filenames: false

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture contracts)
        # Run the .importlinter contracts on every commit. import-linter
        # builds the whole import graph from the installed package, so it
        # needs the worktree's mandatory ``.venv/`` (see CLAUDE.md
        # "Worktree-Based Development") — ``uv run`` targets it. Fast
        # (~1s) and file-independent, so it runs once per commit, not
        # per-file.
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      # Drift-guard: block new "slop" tests (no verification / tautology /
      # bare-except) at authorship. The linter walks the whole test tree via
      # ``ast`` regardless of which files changed, so ``pass_filenames`` is
      # false; ``files`` merely gates it to run only when a test file is
      # touched. Runs in well under a second.
      - id: no-slop-tests
        name: no-slop test linter
        entry: uv run pytest -q src/compiletools/test_no_slop_tests.py
        language: system
        pass_filenames: false
        files: ^src/compiletools/test_.*\.py$
